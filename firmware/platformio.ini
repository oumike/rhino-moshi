; Rhino Companion firmware for the Xteink X4 (ESP32-C3)

[env]
; pioarduino: Arduino core 3.3.12 / ESP-IDF 5.5. Core 3.x is supported by
; LibSSH-ESP32, and its toolchain runs natively on Apple Silicon (the core 2.x
; toolchain is x86-only and needs Rosetta).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.f_flash = 40000000L
; libssh + mbedTLS do not fit the default 1.25 MB app partition.
board_build.partitions = huge_app.csv

lib_deps =
    zinggjm/GxEPD2@^1.5.0
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit GFX Library@^1.11.0
    ewpa/LibSSH-ESP32@^5.10.0
    https://github.com/tzapu/WiFiManager.git#master

build_flags =
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GxEPD2 compiles every panel driver it ships unless told otherwise; the X4
    ; only has the one, and trimming the rest keeps the build small.
    -DGxEPD2_DISPLAY_CLASS=GxEPD2_BW
    -DGxEPD2_DRIVER_CLASS=GxEPD2_426_GDEQ0426T82

[env:xteink_x4]

; Feasibility spike: SSH to a host, tunnel to moshi-hook's loopback gateway,
; and report heap at each step. Configured through the setup portal.
[env:ssh_spike]
build_src_filter = -<*> +<../spike/> +<buttons.cpp> +<settings.cpp> +<setup_portal.cpp>
