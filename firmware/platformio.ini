; Rhino Companion firmware: Xteink X4 (ESP32-C3, e-paper) and Elecrow
; ThinkNode M9 (ESP32-S3, TFT and keyboard).

[env]
; pioarduino: Arduino core 3.3.12 / ESP-IDF 5.5. Core 3.x is supported by
; LibSSH-ESP32, and its toolchain runs natively on Apple Silicon (the core 2.x
; toolchain is x86-only and needs Rosetta).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit GFX Library@^1.11.0
    ewpa/LibSSH-ESP32@^5.10.0

[x4]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
; libssh + mbedTLS do not fit the default 1.25 MB app partition.
board_build.partitions = huge_app.csv
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@^1.5.0
build_flags =
    -DBOARD_X4
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GxEPD2 compiles every panel driver it ships unless told otherwise; the X4
    ; only has the one, and trimming the rest keeps the build small.
    -DGxEPD2_DISPLAY_CLASS=GxEPD2_BW
    -DGxEPD2_DRIVER_CLASS=GxEPD2_426_GDEQ0426T82

; The companion firmware: src/ (the spike lives outside it).
[env:xteink_x4]
extends = x4

; The M9's layout and keyboard handling on an X4, drawn in the top-left
; 320x240 of the panel turned landscape: for checking M9 screens by
; screenshot without one. Type with "text" over serial.
[env:x4_compact_preview]
extends = x4
build_flags =
    ${x4.build_flags}
    -DPREVIEW_COMPACT
    -DHAS_KEYBOARD=1

[env:thinknode_m9]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_M9
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Feasibility spike: SSH to a host, tunnel to moshi-hook's loopback gateway,
; and report heap at each step. Configured through the settings web page.
[env:ssh_spike]
extends = x4
build_src_filter = -<*> +<../spike/> +<buttons.cpp> +<settings.cpp> +<config_server.cpp> +<backup.cpp>
